server:
  port: 8088

spring:
  application:
    name: gateway-service


  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                  - ${FRONTEND_DOCKER_ORIGIN:http://localhost:3000}
                  - ${FRONTEND_PRODUCTION_ORIGIN:https://schedowai.duckdns.org}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"

          routes:

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
              # filters:
              #   - JwtAuthenticationFilter

            - id: schedule-service
              uri: ${SCHEDULE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/schedules/**
              filters:
                - JwtAuthenticationFilter

            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8066}
              predicates:
                - Path=/api/v1/ai/**
            
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG