server:
  port: 8088

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**
              filters:
                - JwtAuthenticationFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info
