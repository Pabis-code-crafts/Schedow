spring.application.name=user-service
server.port=8082

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
spring.jpa.show-sql=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true
schedow.jwt.secret=${JWT_SECRET}
schedow.registration.enabled=${REGISTRATION_ENABLED:true}
schedow.demo-supervisor.email=${DEMO_SUPERVISOR_EMAIL:}
schedow.demo-supervisor.password-hash=${DEMO_SUPERVISOR_PASSWORD_HASH:}
schedow.demo-supervisor.password=${DEMO_SUPERVISOR_PASSWORD:}
schedow.demo-supervisor.name=${DEMO_SUPERVISOR_NAME:Demo Supervisor}
schedow.demo-supervisor.site=${DEMO_SUPERVISOR_SITE:Hatfield}
